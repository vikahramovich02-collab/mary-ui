<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mary UI</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; background: #F6F6F7; overscroll-behavior: none; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #0E0E0F; }
  body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
  .shell { display: flex; min-height: 100vh; }
  .nav { width: 248px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow: auto; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid var(--border); background: var(--bg-panel); display: flex; flex-direction: column; gap: 2px; }
  .brand { font-size: 20px; font-weight: 600; padding: 0 10px; }
  .sub { font-size: 12px; color: var(--text-2); padding: 2px 10px 14px; }
  .search { height: 34px; border-radius: 33px; border: 1px solid var(--border); padding: 0 14px; font: 500 14px var(--font); color: var(--text); background: var(--bg-panel); outline: none; margin-bottom: 10px; }
  .search:focus { border-color: rgba(var(--ink-rgb),0.2); }
  .navi { all: unset; display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; }
  .navi:hover { background: var(--surface); color: var(--text); }
  .navi.on { background: var(--surface); color: var(--text); }
  .cnt { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .ask { position: relative; overflow: hidden; margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 16px; background: var(--surface); text-decoration: none; color: var(--text); }
  .ask:hover { background: rgba(var(--ink-rgb),0.08); }
  .ask-cat { position: absolute; right: 6px; bottom: -2px; width: 42px; height: 42px; image-rendering: pixelated; pointer-events: none; }
  .ask-who { display: flex; align-items: center; gap: 10px; }
  .ask-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ask-ava { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .ask-t { font-size: 13px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
  .ask-s { font-size: 12px; color: var(--text-2); line-height: 1.4; }
  .ask-l { font-size: 12px; font-weight: 500; margin-top: 10px; }
  .top { position: sticky; top: 0; z-index: 50; margin: -32px -32px 16px; padding: 24px 32px 12px; background: rgba(246,246,247,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .top-row { display: flex; align-items: center; gap: 16px; }
  .top-row h1 { flex: 1; min-width: 0; margin: 0; }
  .top .lead { margin: 6px 0 0; }
  .pq { width: 240px; margin: 0; flex-shrink: 0; }
  .main { flex: 1; min-width: 0; padding: 32px 32px 80px; box-sizing: border-box; }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.02em; }
  .lead { font-size: 14px; color: var(--text-2); margin: 0 0 24px; max-width: 760px; line-height: 1.5; }
  .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .tag.prop { background: rgba(var(--accent-rgb),0.1); color: var(--accent); }
  .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px 24px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; font-weight: 500; margin: 0; color: var(--text); }
  .card .src { font-size: 12px; color: var(--text-3); margin: 4px 0 16px; line-height: 1.6; }
  .card .src .note { color: var(--accent); }
  .ch { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .exp { font-size: 12px; color: var(--text-2); }
  .fid { font-size: 12px; color: var(--accent); text-decoration: none; margin-left: auto; }
  .vgrid { display: grid; gap: 16px; }
  .vcell { min-width: 0; }
  .vl { font-size: 11px; font-weight: 500; color: var(--text-2); margin-bottom: 8px; }
  .vid { color: var(--text-3); font-weight: 400; }
  .vbox { padding: 12px; border-radius: 12px; background: repeating-conic-gradient(rgba(var(--ink-rgb),0.03) 0 25%, transparent 0 50%) 0 0 / 16px 16px; overflow: hidden; }
  .igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .icell { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 8px 10px; border-radius: 12px; background: var(--surface); }
  .icell code { font-size: 11px; color: var(--text-2); }
  .grid { display: grid; gap: 0; overflow-x: auto; }
  .grid .h { font-size: 11px; font-weight: 500; color: var(--text-2); padding: 0 12px 10px 0; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .grid .rl { font-size: 12px; font-weight: 500; color: var(--text-2); padding: 14px 12px 14px 0; border-top: 1px solid rgba(var(--ink-rgb),0.06); }
  .grid .c { padding: 14px 16px 14px 0; border-top: 1px solid rgba(var(--ink-rgb),0.06); display: flex; align-items: center; min-height: 40px; }
  .photo { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg,#c9b8a6,#7d8a96); display: grid; place-items: start; padding: 8px; box-sizing: border-box; }
  .glassbg { padding: 12px; border-radius: 16px; background: repeating-linear-gradient(45deg, #EDEDF0 0 10px, #fff 10px 20px); }
  #err:empty { display: none; }
  #err { color: #FF1E00; font: 13px ui-monospace, monospace; white-space: pre-wrap; padding: 24px; }
  @media (max-width: 760px) { .top { margin: -20px -16px 16px; padding: 16px; } .top-row { flex-wrap: wrap; } .pq { width: 100%; } .shell { flex-direction: column; } .nav { position: static; width: auto; height: auto; } .main { padding: 20px 16px 60px; } }
</style>
</head>
<body>
<div id="root" class="mary-ui"></div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script>
// Витрина без сборки: тянем исходники как есть, переписываем import/export в общий реестр и компилируем Babel'ем.
window.MARY_UI_ASSETS = "./assets/";
(async () => {
  try {
    const get = async (p) => { const r = await fetch(p, { cache: "no-cache" }); if (!r.ok) throw new Error(p + " → " + r.status); return p.endsWith(".json") ? r.json() : r.text(); };
    const man = await get("data/manifest.json");
    const J = { manifest: man };
    await Promise.all(["svg", "images", ...man.files].map(async k => { J[k] = await get(`data/${k}.json`); }));
    // раздел компонента — для навигации
    for (const k of man.files) for (const def of Object.values(J[k])) def.section = def.section || k;
    const M = {}, ALL = {};
    const run = async (path, toAll) => {
      let src = await get(path);
      src = src
        .replace(/^import\s+(\w+)\s+from\s+"[^"]*\/(\w+)\.json";?$/gm, 'const $1 = __J["$2"];')
        .replace(/^import\s+\*\s+as\s+(\w+)\s+from\s+"[^"]*index\.js";?$/gm, "const $1 = __ALL;")
        .replace(/^import\s+React(?:\s*,\s*(\{[^}]*\}))?\s+from\s+"react";?$/gm, (m, b) => b ? `const ${b} = React;` : "")
        .replace(/^import\s+(\{[^}]*\})\s+from\s+"[^"]*";?$/gm, "const $1 = __M;")
        .replace(/^export\s+(\*|\{)[^\n]*$/gm, "");
      const names = [...src.matchAll(/^export\s+(?:const|function|class)\s+(\w+)/gm)].map(m => m[1]);
      src = src.replace(/^export\s+(const|function|class)/gm, "$1");
      const code = Babel.transform(src, { presets: ["react"] }).code;
      const ex = new Function("React", "__M", "__J", "__ALL", code + `\nreturn { ${names.join(", ")} };`)(React, M, J, ALL);
      Object.assign(M, ex); if (toAll) Object.assign(ALL, ex);
    };
    await run("components/core/figma-node.jsx", true);
    await run("components/states.jsx", true);
    for (const k of man.files) await run(`components/${k}.jsx`, true);
    await run("showcase/states-demo.jsx");
    await run("showcase/popups-all.jsx");
    await run("showcase/popups-demo.jsx");
    await run("showcase/proto-icons.jsx");
    await run("showcase/app.jsx");
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(M.App));
  } catch (e) {
    document.getElementById("err").textContent = "Ошибка: " + e.message + "\n(открывайте через http-сервер: npx serve .)";
    console.error(e);
  }
})();
</script>
</body>
</html>
